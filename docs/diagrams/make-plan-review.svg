<path d="M 680 60 L 980 60" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-review-arrow)"/>
<path d="M 680 84 L 948 84 Q 956 84 956 92 L 956 144 Q 956 152 964 152 L 980 152" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-review-arrow)"/>
<path d="M 260 280 L 260 300 Q 260 308 268 308 L 472 308 Q 480 308 480 316 L 480 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-review-arrow)"/>
