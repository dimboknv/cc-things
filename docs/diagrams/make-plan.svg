<path d="M 160 336 L 160 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-arrow)"/>
<path d="M 280 444 L 320 444" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-arrow)"/>
