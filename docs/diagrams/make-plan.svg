<rect x="60" y="40" width="200" height="56" rx="20" fill="#f5f5f5"/>
<rect x="60" y="40" width="200" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="160.0" y="65.0" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">/planning:make-plan</text>
<text x="160.0" y="81.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">rules.sh loads the project rules</text>
<polygon points="160,128 260,168 160,208 60,168" fill="#f5f5f5"/>
<polygon points="160,128 260,168 160,208 60,168" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Argument is</text>
<text x="160" y="179" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">a plan path?</text>
<polygon points="160,256 260,296 160,336 60,296" fill="#f5f5f5"/>
<polygon points="160,256 260,296 160,336 60,296" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="160" y="293" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Step 1: is</text>
<text x="160" y="307" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">this a plan?</text>
<rect x="340" y="268" width="220" height="56" rx="20" fill="#f5f5f5"/>
<rect x="340" y="268" width="220" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="450.0" y="293.0" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">No plan needed</text>
<text x="450.0" y="309.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">mechanical edit: name it, stop</text>
<rect x="40" y="384" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect x="40" y="384" width="240" height="120" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<rect x="48" y="392" width="42" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/><text x="69.0" y="401" fill="#bf4520" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
<text x="160.0" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Discovery is verification</text>
<text x="160.0" y="442" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">premises: anchors run now</text>
<text x="160.0" y="456" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">consumers, records, vendor docs</text>
<text x="160.0" y="470" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">files shared by parallel tasks</text>
<text x="160.0" y="484" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">Explore wave (1-3) after the go</text>
<rect x="320" y="384" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect x="320" y="384" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="328" y="392" width="42" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="349.0" y="401" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
<text x="440.0" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Forks, one at a time</text>
<text x="440.0" y="442" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">list first, then “fork 2 of 5”</text>
<text x="440.0" y="456" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">options priced, simplest first</text>
<text x="440.0" y="470" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">answers → Decisions, Sign-off</text>
<text x="440.0" y="484" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">brainstorm decisions not re-asked</text>
<rect x="600" y="384" width="400" height="218" rx="6" fill="#f5f5f5"/>
<rect x="600" y="384" width="400" height="218" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="608" y="392" width="42" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="629.0" y="401" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 4</text>
<text x="800.0" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Write the plan, then self-check</text>
<text x="800.0" y="442" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">hold it to the plan lens once, fix what it finds</text>
<text x="800.0" y="456" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">acceptance.py: every acceptance must fail today</text>
<text x="800.0" y="470" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">mode: light only when every condition holds</text>
<rect x="616" y="484" width="368" height="106" rx="4" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
<rect x="624" y="492" width="102" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="675.0" y="501" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REFERENCES/FORM.MD</text>
<text x="628" y="520" fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace">Goal · Owner Sign-off · Decisions · Premises</text>
<text x="628" y="534" fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace">Out of Scope · Execution · Implementation Steps</text>
<text x="628" y="548" fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace">Post-Completion · + 2 sections when needed</text>
<text x="628" y="562" fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace">task: Result · Decision · Where · Repo ·</text>
<text x="628" y="576" fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace">      After · Needs · checkboxes · acceptance:</text>
<rect x="1040" y="416" width="200" height="56" rx="20" fill="#f5f5f5"/>
<rect x="1040" y="416" width="200" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="1140.0" y="441.0" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Step 5: the menu</text>
<text x="1140.0" y="457.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">review · commit · done</text>
<rect x="880" y="100" width="360" height="136" rx="6" fill="#f5f5f5"/>
<rect x="880" y="100" width="360" height="136" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="888" y="108" width="47" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="911.5" y="117" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REFRESH</text>
<text x="1060.0" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Refresh the plan against the tree</text>
<text x="1060.0" y="158" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">since the plan&#x27;s last commit, else its mtime</text>
<text x="1060.0" y="172" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">git log over the areas of every Where:</text>
<text x="1060.0" y="186" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">rerun premises; recheck records and skills</text>
<text x="1060.0" y="200" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">After:, shared files, Needs:, Mode</text>
<text x="1060.0" y="214" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">false premise → fork; the rest edited in place</text>
