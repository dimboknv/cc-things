<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Развилка</title>
<style>
:root {
  --bg: var(--agterm-background, Canvas);
  --fg: var(--agterm-foreground, CanvasText);
  --accent: var(--agterm-color-4, #3d7fd9);
  --new: var(--agterm-color-2, #4fa35a);
  --gone: var(--agterm-color-1, #c8463c);
  --warn: var(--agterm-color-3, #c99a1e);
  --dim: color-mix(in srgb, var(--fg) 60%, transparent);
  --line: color-mix(in srgb, var(--fg) 16%, transparent);
  --panel: color-mix(in srgb, var(--fg) 5%, transparent);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, sans-serif; padding: 24px 28px 150px; }
.wrap { max-width: 1500px; margin: 0 auto; }
.eyebrow, .sec { color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
h1 { font-size: 24px; line-height: 1.25; margin: 4px 0 6px; text-wrap: balance; }
.sec { margin: 28px 0 10px; }
p { margin: 0; max-width: 68ch; }
.unchecked { color: var(--warn); }
.pic { min-width: 0; overflow-x: auto; }
.body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

.today { display: grid; grid-template-columns: minmax(300px, 2fr) 3fr; gap: 24px; align-items: start;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
.today.nopic { grid-template-columns: 1fr; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--dim); }
.legend i { display: inline-block; width: 22px; border-top: 2px solid var(--dim); vertical-align: middle; margin-right: 6px; }
.legend i.new { border-color: var(--new); }
.legend i.gone { border-color: var(--gone); border-top-style: dashed; }

.opts { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 16px; }
.split { display: contents; }
.opt { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; background: var(--panel); }
.opt { cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; background: color-mix(in srgb, var(--accent) 9%, transparent); }
.opt.sel .key, .opt.sel h3 { color: var(--accent); }
.mark { margin-left: auto; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--bg); background: var(--accent); border-radius: 99px; padding: 1px 8px; white-space: nowrap; display: none; }
.opt.sel .mark { display: inline; }
.opt.sel .badge { margin-left: 0; }
.opt > header { display: flex; align-items: baseline; gap: 10px; }
.opt .key { font-weight: 700; color: var(--accent); }
.opt h3 { margin: 0; font-size: 17px; line-height: 1.3; }
.badge { margin-left: auto; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--new);
  border: 1px solid var(--new); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.opt .body { flex: 1; }
.rows .opts { grid-template-columns: 1fr; }
.rows .opt .split { display: grid; grid-template-columns: 3fr 2fr; gap: 24px; align-items: start; }

ol.steps { margin: 0; padding: 0; list-style: none; font-size: 14px; display: grid; gap: 4px; counter-reset: step; }
ol.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; counter-increment: step; }
ol.steps li::before { content: counter(step); display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  font-size: 11px; border: 1px solid var(--dim); color: var(--dim); margin-top: 1px; }
ol.steps li.new::before { border-color: var(--new); color: var(--new); }
.price { font-size: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.price::before { content: "Цена"; display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
.chip { display: inline-block; font-size: 12px; border-radius: 6px; padding: 2px 8px; border: 1px solid var(--line); color: var(--dim); margin: 0 4px 6px 0; }
.chip.new { border-color: var(--new); color: var(--new); }
.chip.gone { border-color: var(--gone); color: var(--gone); }
.why { background: color-mix(in srgb, var(--new) 10%, transparent); border-left: 3px solid var(--new); padding: 8px 12px; border-radius: 0 6px 6px 0; font-size: 14px; }
.act { margin-top: auto; display: grid; gap: 8px; }

button { font: inherit; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 10px; width: 100%; min-height: 38px; resize: vertical; field-sizing: content; }
textarea::placeholder { color: var(--dim); }

.others { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-top: 16px; }
.others .opt { background: transparent; border-style: dashed; }
details.rejected { margin-top: 16px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 18px; }
details.rejected summary { cursor: pointer; color: var(--dim); }
details.rejected label { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); margin-top: 8px; font-size: 14px; }
details.rejected label b { display: block; }
details.rejected label span { color: var(--dim); }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 28px; }
.bar .in { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: end; }
.bar .btns { display: flex; gap: 8px; align-items: center; }
.state { font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.state b { color: var(--fg); }
.hint { font-size: 12px; color: var(--dim); }
#err { color: var(--gone); font-size: 13px; white-space: pre-wrap; }

svg { max-width: 100%; height: auto; display: block; }
svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
svg .node rect { fill: var(--bg); stroke: var(--dim); stroke-width: 1.2; }
svg .node.new rect { stroke: var(--new); stroke-width: 2; }
svg .node.new text { fill: var(--new); font-weight: 600; }
svg .node.off { opacity: .35; }
svg .edge { stroke: var(--dim); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
svg .edge.new { stroke: var(--new); stroke-width: 2; marker-end: url(#arrow-new); }
svg .edge.gone { stroke: var(--gone); stroke-dasharray: 5 4; opacity: .7; marker-end: url(#arrow-gone); }
svg .num circle { fill: var(--bg); stroke: var(--dim); }
svg .num text { font-size: 10px; fill: var(--dim); }
svg .num.new circle { stroke: var(--new); }
svg .num.new text { fill: var(--new); }
svg .tag { font-size: 9px; letter-spacing: .06em; fill: var(--new); }

@media (max-width: 900px) { .today, .rows .opt .split, .bar .in { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--dim)"/></marker>
  <marker id="arrow-new" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--new)"/></marker>
  <marker id="arrow-gone" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--gone)"/></marker>
</defs></svg>

<div id="src" hidden>
<!--FORK-->
</div>

<div class="wrap" id="page"></div>

<div class="bar"><div class="in">
  <div>
    <div class="state" id="state"></div>
    <textarea id="general" data-c="general" placeholder="Общий комментарий к развилке"></textarea>
    <div id="err"></div>
  </div>
  <div class="btns">
    <span class="hint" id="hint"></span>
    <button type="button" id="cancel">Отмена</button>
    <button type="button" class="primary" id="send">Отправить</button>
  </div>
</div></div>

<script>
const H = 34;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svgEl = (tag, attrs, text) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
};

const root = document.querySelector('#src [data-place]');
const rolesSrc = root.querySelector('script[data-roles]');
const ROLES = rolesSrc ? JSON.parse(rolesSrc.textContent) : {};
for (const r of Object.values(ROLES)) r.w = r.w || Math.max(70, r.label.length * 7 + 18);
const box = Object.values(ROLES).reduce((b, r) => [Math.max(b[0], r.x + r.w + 46), Math.max(b[1], r.y + H + 6)], [0, 0]);

function edgePoint(a, b) {
  const cx = a.x + a.w / 2, cy = a.y + H / 2, dx = b.x + b.w / 2 - cx, dy = b.y + H / 2 - cy;
  const t = Math.min(dx ? (a.w / 2 + 3) / Math.abs(dx) : Infinity, dy ? (H / 2 + 3) / Math.abs(dy) : Infinity);
  return [cx + dx * t, cy + dy * t];
}
function drawFlow(flow) {
  const svg = svgEl('svg', {viewBox: `0 0 ${box[0]} ${box[1]}`, width: box[0] * 1.6, role: 'img'});
  for (const [from, to, kind, num] of flow.edges || []) {
    const [x1, y1] = edgePoint(ROLES[from], ROLES[to]), [x2, y2] = edgePoint(ROLES[to], ROLES[from]);
    svg.append(svgEl('line', {class: `edge ${kind || ''}`, x1, y1, x2, y2}));
    if (num) {
      const g = svgEl('g', {class: `num ${kind || ''}`});
      g.append(svgEl('circle', {cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, r: 8}),
        svgEl('text', {x: (x1 + x2) / 2, y: (y1 + y2) / 2 + 3.5, 'text-anchor': 'middle'}, num));
      svg.append(g);
    }
  }
  for (const [id, kind] of Object.entries(flow.nodes || {})) {
    const r = ROLES[id], g = svgEl('g', {class: `node ${kind || ''}`});
    g.append(svgEl('rect', {x: r.x, y: r.y, width: r.w, height: H, rx: 6}),
      svgEl('text', {x: r.x + r.w / 2, y: r.y + H / 2 + 4, 'text-anchor': 'middle'}, r.label));
    if (kind === 'new') g.append(svgEl('text', {class: 'tag', x: r.x + r.w + 5, y: r.y + H / 2 + 3}, 'НОВОЕ'));
    svg.append(g);
  }
  return svg;
}
root.querySelectorAll('script[data-flow]').forEach(s => {
  const fig = el('figure'); fig.style.margin = 0;
  fig.append(drawFlow(JSON.parse(s.textContent)));
  s.replaceWith(fig);
});

// the picture of a block is its first element when that is a figure or an svg
function split(node) {
  const first = node.firstElementChild, pic = el('div', 'pic'), body = el('div', 'body');
  const hasPic = first && (first.tagName === 'FIGURE' || first.tagName.toLowerCase() === 'svg');
  if (hasPic) pic.append(first);
  body.append(...node.childNodes);
  return {pic: hasPic ? pic : null, body};
}
const comment = (key, placeholder) => { const t = el('textarea'); t.dataset.c = key; t.placeholder = placeholder; return t; };
const card = (id, head) => {
  const c = el('article', 'opt'); c.dataset.id = id; c.tabIndex = 0; c.setAttribute('role', 'button');
  head.append(el('span', 'mark', 'выбрано'));
  c.append(head);
  return c;
};

const page = document.getElementById('page');
document.title = `Развилка ${root.dataset.place}: ${root.dataset.title}`;
page.append(el('div', 'eyebrow', `Развилка ${root.dataset.place}`), el('h1', '', root.dataset.title));

const todaySrc = root.querySelector('[data-today]');
if (todaySrc) {
  const {pic, body} = split(todaySrc), today = el('section', 'today' + (pic ? '' : ' nopic'));
  const legend = el('div', 'legend');
  for (const [cls, text] of [['', 'как сегодня'], ['new', 'появляется'], ['gone', 'уходит']]) {
    const s = el('span'); s.append(el('i', cls), text); legend.append(s);
  }
  body.append(legend, comment('today', 'Комментарий к «как сегодня»: что здесь не так'));
  if (pic) today.append(pic);
  today.append(body);
  page.append(el('div', 'sec', 'Как сегодня'), today);
}

const names = {own: 'свой вариант', explain: 'объяснить проще'};
const keys = {};
const opts = el('div', 'opts');
[...root.querySelectorAll('[data-option]')].forEach((src, i) => {
  const id = src.dataset.option, key = String(i + 1);
  names[id] = `${key}. ${src.dataset.title}`; keys[key] = id;
  const head = el('header');
  head.append(el('span', 'key', key), el('h3', '', src.dataset.title));
  if (src.hasAttribute('data-recommended')) head.append(el('span', 'badge', 'рекомендую'));
  const {pic, body} = split(src), act = el('div', 'act');
  act.append(comment(id, 'Комментарий к этому варианту'));
  body.append(act);
  const inner = el('div', 'split');
  if (pic) inner.append(pic);
  inner.append(body);
  const c = card(id, head);
  c.append(inner);
  opts.append(c);
});
page.append(el('div', 'sec', 'Варианты'), opts);

// columns only while every option fits in one row at a readable width; a ragged second row breaks the comparison
const COLUMN_MIN = 330;
function layout() {
  const n = opts.children.length;
  opts.style.setProperty('--n', n);
  const fits = page.clientWidth >= n * COLUMN_MIN + (n - 1) * 16;
  page.classList.toggle('rows', root.dataset.layout === 'rows' || !fits);
}
layout();
addEventListener('resize', layout);

const others = el('div', 'others');
for (const [id, title, ph] of [['own', 'Свой вариант', 'Опиши, как сделал бы ты'],
  ['explain', 'Не понял, объясни проще', 'Что именно непонятно']]) {
  const head = el('header'); head.append(el('h3', '', title));
  const act = el('div', 'act'); act.append(comment(id, ph));
  const c = card(id, head);
  c.append(act); others.append(c);
}
page.append(others);

const rejectedSrc = [...root.querySelectorAll('[data-rejected]')];
if (rejectedSrc.length) {
  const box = el('details', 'rejected');
  box.append(el('summary', '', `Рассмотрено и отсеяно: ${rejectedSrc.length}`));
  for (const src of rejectedSrc) {
    const row = el('label'), check = el('input'), text = el('div'), why = el('span');
    check.type = 'checkbox'; check.dataset.reopen = src.dataset.rejected;
    why.append(...src.childNodes);
    text.append(el('b', '', src.dataset.title), why, el('span', 'hint', ' — отметь, чтобы вернуть в обсуждение'));
    row.append(check, text); box.append(row);
  }
  page.append(box);
}
document.getElementById('hint').textContent = `клик по карточке или 1–${Object.keys(keys).length} выбирает · ⌘↵ отправить`;

let choice = null;
function select(id, keep) {
  choice = !keep && choice === id ? null : id;
  document.querySelectorAll('.opt').forEach(card => {
    const on = card.dataset.id === choice;
    card.classList.toggle('sel', on);
    card.setAttribute('aria-pressed', on);
  });
  const state = document.getElementById('state');
  state.textContent = '';
  if (choice) state.append('Выбрано: ', el('b', '', names[choice]));
  else state.append('Ничего не выбрано. Можно отправить и одни комментарии.');
  save();
}
function answer() {
  const comments = {};
  document.querySelectorAll('textarea[data-c]').forEach(t => { if (t.value.trim() && t.dataset.c !== 'general') comments[t.dataset.c] = t.value.trim(); });
  const reopen = [...document.querySelectorAll('input[data-reopen]:checked')].map(c => c.dataset.reopen);
  return {place: root.dataset.place, choice, comments, general: document.getElementById('general').value.trim(), reopen};
}

// a theme change reloads the page; the draft has to survive it
const DRAFT = 'fork-draft:' + location.pathname;
function save() {
  const draft = {choice, text: {}, reopen: answer().reopen};
  document.querySelectorAll('textarea[data-c]').forEach(t => { draft.text[t.dataset.c] = t.value; });
  try { localStorage.setItem(DRAFT, JSON.stringify(draft)); } catch (e) { /* storage may be off */ }
}
function restore() {
  let draft = null;
  try { draft = JSON.parse(localStorage.getItem(DRAFT)); } catch (e) { /* no draft */ }
  if (!draft) return select(null, true);
  document.querySelectorAll('textarea[data-c]').forEach(t => { t.value = draft.text[t.dataset.c] || ''; });
  document.querySelectorAll('input[data-reopen]').forEach(c => { c.checked = (draft.reopen || []).includes(c.dataset.reopen); });
  select(names[draft.choice] ? draft.choice : null, true);
}
const forget = () => { try { localStorage.removeItem(DRAFT); } catch (e) { /* storage may be off */ } };

function fail(e) { document.getElementById('err').textContent = String(e && e.message || e); }
function send() {
  const value = JSON.stringify(answer());
  if (!window.agterm) return fail('вне agterm, ответ был бы таким:\n' + value);
  agterm.request('session.overlay.submit', {args: {value}}).then(forget).catch(fail);
}
function cancel() {
  if (!window.agterm) return fail('вне agterm: отмена');
  agterm.request('session.overlay.close', {}).then(forget).catch(fail);
}
// a click that ends a text selection or lands in a comment field is not a pick
document.addEventListener('click', e => {
  const c = e.target.closest('.opt');
  if (!c || e.target.closest('textarea, input, a') || String(getSelection())) return;
  select(c.dataset.id);
});
document.addEventListener('input', save);
document.getElementById('send').addEventListener('click', send);
document.getElementById('cancel').addEventListener('click', cancel);
document.addEventListener('keydown', e => {
  if (e.metaKey && e.key === 'Enter') { e.preventDefault(); return send(); }
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (keys[e.key]) return select(keys[e.key]);
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('opt')) { e.preventDefault(); select(e.target.dataset.id); }
});
restore();
</script>
</body>
</html>
