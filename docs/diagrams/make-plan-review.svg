<path d="M 400 560 L 80 560 Q 72 560 72 552 L 72 80 Q 72 72 80 72 L 440 72" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-review-arrow)"/>
<!-- Nodes -->
<rect x="440" y="40" width="240" height="64" rx="20" fill="#f5f5f5"/>
<rect x="440" y="40" width="240" height="64" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="560.0" y="62.0" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Step 5: the menu</text>
<text x="560.0" y="78.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">one question, recommended first</text>
<text x="560.0" y="91.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">untracked plan: no commit item</text>
<rect x="120" y="160" width="280" height="120" rx="6" fill="#f5f5f5"/>
<rect x="120" y="160" width="280" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="128" y="168" width="62" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="159.0" y="177" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">1 · REVMUX</text>
<text x="260.0" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">revmux plan round</text>
<text x="260.0" y="218" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">profile plan: two models at xhigh</text>
<text x="260.0" y="232" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">after edits: plan-recheck, at most 2</text>
<text x="260.0" y="246" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">a major left after that → owner fork</text>
<text x="260.0" y="260" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">first pick for a full plan</text>
<rect x="440" y="160" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect x="440" y="160" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="448" y="168" width="57" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="476.5" y="177" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">2 · AGENT</text>
<text x="560.0" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">plan-review agent</text>
<text x="560.0" y="218" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">one model, the plan lens once</text>
<text x="560.0" y="232" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">plan, lens, form, rules by path</text>
<text x="560.0" y="246" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">first pick for a light plan</text>
<rect x="720" y="160" width="240" height="120" rx="6" fill="#f5f5f5"/>
<rect x="720" y="160" width="240" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="728" y="168" width="62" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="759.0" y="177" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">3 · WEBREV</text>
<text x="840.0" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">webrev page</text>
<text x="840.0" y="218" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">the owner annotates the plan</text>
<text x="840.0" y="232" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">edited | answered | disagree</text>
<text x="840.0" y="246" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">only inside agterm</text>
<rect x="980" y="20" width="260" height="84" rx="6" fill="#f5f5f5"/>
<rect x="980" y="20" width="260" height="84" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="988" y="28" width="62" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="1019.0" y="37" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">4 · COMMIT</text>
<text x="1110.0" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Commit the plan</text>
<text x="1110.0" y="78" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">commit.sh, into the current branch</text>
<rect x="980" y="128" width="260" height="48" rx="20" fill="#f5f5f5"/>
<rect x="980" y="128" width="260" height="48" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="1110.0" y="149.0" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">5 · Done</text>
<text x="1110.0" y="165.0" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">stop; untracked: print exec-plan</text>
<rect x="400" y="336" width="320" height="120" rx="6" fill="#f5f5f5"/>
<rect x="400" y="336" width="320" height="120" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<rect x="408" y="344" width="87" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.55"/><text x="451.5" y="353" fill="#bf4520" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">REVIEW FINDINGS</text>
<text x="560.0" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">Each finding: fact, fork or noise</text>
<text x="560.0" y="394" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">fact → check the tree, edit the plan</text>
<text x="560.0" y="408" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">fork → ask the owner, as in Step 3</text>
<text x="560.0" y="422" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">noise → drop it, say why</text>
<text x="560.0" y="436" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">minor → one-line edit, else a note</text>
<rect x="400" y="500" width="320" height="120" rx="6" fill="#f5f5f5"/>
<rect x="400" y="500" width="320" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="408" y="508" width="47" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/><text x="431.5" y="517" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.08em">VERDICT</text>
<text x="560.0" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="system-ui, -apple-system, sans-serif, sans-serif" text-anchor="middle">The skill&#x27;s own verdict</text>
<text x="560.0" y="558" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">ready: no critical or major left</text>
<text x="560.0" y="572" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">another round: &lt;the weightiest finding&gt;</text>
<text x="560.0" y="586" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">ready → commit (tracked) or done</text>
<text x="560.0" y="600" fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle">after edits → plan-recheck, if a round ran</text>
<!-- Arrow labels -->
<rect x="789" y="40" width="82" height="12" rx="2" fill="#f5f5f5"/><text x="830" y="49" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.12em">TRACKED PLAN</text>
<rect x="80" y="394" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="115" y="403" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace, monospace" text-anchor="middle" letter-spacing="0.12em">MENU AGAIN</text>
<!-- Callouts -->
<text x="772" y="400" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif, serif" text-anchor="start">a finding is input, not authority</text>
<path d="M 768 396 Q 748 392 724 396" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/><circle cx="724" cy="396" r="2" fill="#2d3142"/>
<text x="772" y="564" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif, serif" text-anchor="start">the agent&#x27;s verdict is one more input</text>
<path d="M 768 560 Q 748 556 724 560" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/><circle cx="724" cy="560" r="2" fill="#2d3142"/>
