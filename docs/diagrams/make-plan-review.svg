<text x="72" y="698" fill="#4f5d75" font-size="8.5" font-family="system-ui, -apple-system, sans-serif, sans-serif">Menu / end</text>
<rect x="162" y="688" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="194" y="698" fill="#4f5d75" font-size="8.5" font-family="system-ui, -apple-system, sans-serif, sans-serif">Step</text>
<rect x="254" y="688" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="286" y="698" fill="#4f5d75" font-size="8.5" font-family="system-ui, -apple-system, sans-serif, sans-serif">Focal step</text>
<line x1="376" y1="694" x2="398" y2="694" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#make-plan-review-arrow)"/>
<text x="408" y="698" fill="#4f5d75" font-size="8.5" font-family="system-ui, -apple-system, sans-serif, sans-serif">Flow</text>
<line x1="468" y1="694" x2="492" y2="694" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
<text x="500" y="698" fill="#4f5d75" font-size="8.5" font-family="system-ui, -apple-system, sans-serif, sans-serif">Callout</text>
