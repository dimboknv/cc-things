<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="exec-plan-title exec-plan-desc" id="exec-plan-root">
        <title id="exec-plan-title">How /planning:exec-plan runs a plan</title>
        <desc id="exec-plan-desc">A run checks the plan and the host, waits for the owner's go, cuts the branches and runs the tasks in waves, checks the whole tree, reviews each branch in up to three revmux rounds and finalizes; any stop ends the session on a stop report, and running the skill again continues from the journal.</desc>
        <defs>
      <style>#exec-plan-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     system-ui, -apple-system, sans-serif, system-ui, sans-serif;
      --font-serif:    ui-serif, Georgia, serif, serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, monospace, ui-monospace, monospace; }
      #exec-plan-root { font-family: var(--font-sans); color: var(--color-ink); }
      #exec-plan-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#exec-plan-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="exec-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="exec-plan-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Bands -->
        <rect x="24" y="24" width="1232" height="148" rx="8" fill="#4f5d75" stroke="#2d3142" fill-opacity="0.035" stroke-opacity="0.12"/>
        <rect x="24" y="188" width="1232" height="204" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="24" y="408" width="1232" height="120" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.035" stroke-opacity="0.12"/>
        <g fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace" letter-spacing="0.14em">
          <text x="40" y="44">WAIT / RECOVERY</text>
          <text x="40" y="208">PRIMARY PHASES</text>
          <text x="40" y="428">TERMINAL OUTCOMES</text>
        </g>

        <!-- Stop bracket: a stop can come from any phase it spans -->
        <path d="M360 232 V224 H1236 V232" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Transitions, drawn before states -->
        <line x1="228" y1="288" x2="292" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="480" y1="288" x2="544" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="732" y1="288" x2="796" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="984" y1="288" x2="1048" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <path d="M440 336 V352 Q440 360 432 360 H340 Q332 360 332 352 V336" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#exec-plan-arrow-accent)"/>
        <path d="M944 336 V352 Q944 360 936 360 H844 Q836 360 836 352 V336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="180" y1="336" x2="180" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="1142" y1="336" x2="1142" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <line x1="764" y1="224" x2="764" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#exec-plan-arrow)"/>
        <path d="M672 100 H340 Q332 100 332 108 V240" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#exec-plan-arrow)"/>

        <!-- Transition labels on opaque masks -->
        <g font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em" fill="#4f5d75">
          <rect x="233" y="294" width="54" height="12" rx="2" fill="#f5f5f5"/><text x="260" y="303">OWNER'S GO</text>
          <rect x="485" y="270" width="54" height="12" rx="2" fill="#f5f5f5"/><text x="512" y="279">ALL CLOSED</text>
          <rect x="745" y="270" width="38" height="12" rx="2" fill="#f5f5f5"/><text x="764" y="279">GREEN</text>
          <rect x="989" y="270" width="54" height="12" rx="2" fill="#f5f5f5"/><text x="1016" y="279">REPOS DONE</text>
          <rect x="361" y="366" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="386" y="375" fill="#bf4520">NEXT WAVE</text>
          <rect x="865" y="366" width="50" height="12" rx="2" fill="#f5f5f5"/><text x="890" y="375">NOT CLEAN</text>
          <rect x="188" y="364" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="223" y="373">FALSE PREMISE</text>
          <rect x="1150" y="364" width="62" height="12" rx="2" fill="#f5f5f5"/><text x="1181" y="373">PLAN CLOSED</text>
          <rect x="772" y="194" width="74" height="12" rx="2" fill="#f5f5f5"/><text x="809" y="203">OWNER, BLOCKER</text>
          <rect x="482" y="82" width="46" height="12" rx="2" fill="#f5f5f5"/><text x="505" y="91">CONTINUE</text>
        </g>

        <!-- Primary phases -->
        <g font-family="system-ui, -apple-system, sans-serif,sans-serif" text-anchor="middle">
          <g>
            <rect x="40" y="240" width="188" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
            <rect x="50" y="250" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="70" y="259" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEP 1</text>
            <text x="134" y="282" fill="#2d3142" font-size="12" font-weight="600">Check, then ask</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="134" y="298">journal · peer? · repos</text>
              <text x="134" y="311">premises · sign-off · waves</text>
              <text x="134" y="324">environment · disk · tools</text>
            </g>
          </g>
          <g>
            <rect x="292" y="240" width="188" height="96" rx="8" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
            <rect x="302" y="250" width="54" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.5"/>
            <text x="329" y="259" fill="#bf4520" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEPS 1–3</text>
            <text x="386" y="282" fill="#2d3142" font-size="12" font-weight="600">Run the waves</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="386" y="298">worktrees at trunk sha</text>
              <text x="386" y="311">base.sh · preflight</text>
              <text x="386" y="324">lanes, then integrator</text>
            </g>
          </g>
          <g>
            <rect x="544" y="240" width="188" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
            <rect x="554" y="250" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="574" y="259" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEP 3</text>
            <text x="638" y="282" fill="#2d3142" font-size="12" font-weight="600">Whole-tree check</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="638" y="298">one subagent per repo</text>
              <text x="638" y="311">drift · docs · build</text>
              <text x="638" y="324">lint · all tests · fix</text>
            </g>
          </g>
          <g>
            <rect x="796" y="240" width="188" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
            <rect x="806" y="250" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="826" y="259" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEP 5</text>
            <text x="890" y="282" fill="#2d3142" font-size="12" font-weight="600">Review rounds</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="890" y="298">revmux, then the fixer</text>
              <text x="890" y="311">fact · fork · noise</text>
              <text x="890" y="324">≤ 3 rounds · minor pass</text>
            </g>
          </g>
          <g>
            <rect x="1048" y="240" width="188" height="96" rx="8" fill="#ffffff" stroke="#2d3142"/>
            <rect x="1058" y="250" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="1078" y="259" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEP 6</text>
            <text x="1142" y="282" fill="#2d3142" font-size="12" font-weight="600">Finalize</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="1142" y="298">regroup behind backup/</text>
              <text x="1142" y="311">empty diff · close plan</text>
              <text x="1142" y="324">clean up · audit</text>
            </g>
          </g>
        </g>

        <!-- Recovery state -->
        <g font-family="system-ui, -apple-system, sans-serif,sans-serif" text-anchor="middle">
          <rect x="672" y="56" width="184" height="88" rx="8" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="5,4"/>
          <rect x="682" y="66" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
          <text x="702" y="75" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">STEP 4</text>
          <text x="764" y="98" fill="#2d3142" font-size="12" font-weight="600">Stop report</text>
          <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
            <text x="764" y="114">in chat; the session ends</text>
            <text x="764" y="127">owner answers in the plan</text>
          </g>
        </g>

        <!-- Terminal outcomes -->
        <g font-family="system-ui, -apple-system, sans-serif,sans-serif" text-anchor="middle">
          <g>
            <rect x="40" y="440" width="188" height="72" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="3,3" fill-opacity="0.04"/>
            <rect x="50" y="450" width="54" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="77" y="459" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">TERMINAL</text>
            <text x="134" y="480" fill="#2d3142" font-size="12" font-weight="600">Back to make-plan</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="134" y="495">no branch, no worktree</text>
            </g>
          </g>
          <g>
            <rect x="1048" y="440" width="188" height="72" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.04"/>
            <rect x="1058" y="450" width="54" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.45"/>
            <text x="1085" y="459" fill="#4f5d75" font-size="7" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">TERMINAL</text>
            <text x="1142" y="480" fill="#2d3142" font-size="12" font-weight="600">Run report, revdiff</text>
            <g fill="#4f5d75" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
              <text x="1142" y="495">owner reads base...HEAD</text>
            </g>
          </g>
        </g>

        <!-- Inset: the light run -->
        <g>
          <rect x="416" y="428" width="448" height="84" rx="6" fill="#2d3142" stroke="#2d3142" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.2"/>
          <text x="432" y="448" fill="#4f5d75" font-size="8" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace" letter-spacing="0.14em">INSET · LIGHT RUN (MODE light)</text>
          <g fill="#2d3142" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace">
            <text x="432" y="466">one executor in the run worktree: no lanes, no integrator, no peer</text>
            <text x="432" y="481">check: whole-tree build + lint, tests of what the branch touched</text>
            <text x="432" y="496">review: at most 2 rounds on the light lens set</text>
          </g>
        </g>

        <!-- Callouts -->
        <text x="48" y="80" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif,serif">after the go, nothing is asked</text>
        <text x="48" y="98" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif,serif">until a report</text>
        <path d="M196 104 Q252 150 260 286" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="260" cy="288" r="2" fill="#2d3142"/>
        <text x="996" y="96" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif,serif">a stop ends the session;</text>
        <text x="996" y="114" fill="#2d3142" font-size="14" font-style="italic" font-family="ui-serif, Georgia, serif,serif">/exec-plan &lt;plan&gt; continues</text>
        <path d="M988 100 H860" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <circle cx="860" cy="100" r="2" fill="#2d3142"/>

        <!-- Legend -->
        <line x1="24" y1="544" x2="1256" y2="544" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <g font-family="ui-monospace, 'SF Mono', Menlo, monospace,monospace" font-size="8" fill="#4f5d75">
          <text x="24" y="572" letter-spacing="0.14em">LEGEND</text>
          <rect x="96" y="562" width="20" height="12" rx="3" fill="#ffffff" stroke="#2d3142"/>
          <text x="124" y="572">phase</text>
          <rect x="184" y="562" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
          <text x="212" y="572">focal: the waves (detail: exec-plan-waves)</text>
          <rect x="452" y="562" width="20" height="12" rx="3" fill="#f5f5f5" stroke="#4f5d75" stroke-dasharray="3,2"/>
          <text x="480" y="572">wait / recovery</text>
          <rect x="584" y="562" width="20" height="12" rx="3" fill="#2d3142" stroke="#4f5d75" fill-opacity="0.04"/>
          <text x="612" y="572">terminal</text>
          <path d="M680 568 H708" stroke="#4f5d75" stroke-width="1.2"/><polygon points="708 565, 714 568, 708 571" fill="#4f5d75"/>
          <text x="722" y="572">transition</text>
          <path d="M796 568 H824" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/><polygon points="824 565, 830 568, 824 571" fill="#4f5d75"/>
          <text x="838" y="572">continuation</text>
          <path d="M924 572 V564 H952 V572" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
          <text x="960" y="572">a stop can come from any phase under it</text>
        </g>
      </svg>
