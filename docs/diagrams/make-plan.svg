<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="make-plan-title make-plan-desc" id="make-plan-root">
        <title id="make-plan-title">How /planning:make-plan writes a plan</title>
        <desc id="make-plan-desc">Flowchart of the make-plan skill: the project rules load, Step 1 decides whether the work needs a plan, discovery verifies the premises, forks go to the owner one at a time, the plan is written in the form and self-checked, and a plan path enters a refresh that ends in the same menu.</desc>
        <defs>
      <style>#make-plan-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     system-ui, -apple-system, sans-serif, system-ui, sans-serif;
      --font-serif:    ui-serif, Georgia, serif, serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, monospace, ui-monospace, monospace; }
      #make-plan-root { font-family: var(--font-sans); color: var(--color-ink); }
      #make-plan-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#make-plan-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="make-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="make-plan-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
