<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="make-plan-review-title make-plan-review-desc" id="make-plan-review-root">
        <title id="make-plan-review-title">make-plan: the review loop</title>
        <desc id="make-plan-review-desc">Flowchart of the make-plan menu: a revmux plan round, the plan-review agent or a webrev reading produce findings, each finding is a fact, a fork or noise, the skill gives a verdict and the menu returns with the next item until commit or done.</desc>
        <defs>
      <style>#make-plan-review-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     system-ui, -apple-system, sans-serif, system-ui, sans-serif;
      --font-serif:    ui-serif, Georgia, serif, serif;
      --font-mono:     ui-monospace, 'SF Mono', Menlo, monospace, ui-monospace, monospace; }
      #make-plan-review-root { font-family: var(--font-sans); color: var(--color-ink); }
      #make-plan-review-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#make-plan-review-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="make-plan-review-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="make-plan-review-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
