<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The planning loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1032px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · planning plugin</p>
    <h1>The planning loop</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1032 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="planning-loop-title planning-loop-desc">
        <title id="planning-loop-title">The planning loop</title>
        <desc id="planning-loop-desc">The three planning skills in order, brainstorm, make-plan and exec-plan, with what each takes and hands on, what the owner decides at each, and the outside tools each one leans on.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Owner lane tint, lane dividers, label column border -->
        <rect x="160" y="240" width="832" height="120" fill="rgba(45,49,66,0.018)"/>
        <g stroke="rgba(45,49,66,0.12)" stroke-width="0.8">
          <line x1="40" y1="240" x2="992" y2="240"/>
          <line x1="40" y1="360" x2="992" y2="360"/>
        </g>
        <line x1="160" y1="128" x2="160" y2="480" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

        <!-- Lane labels -->
        <g fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.08em">
          <text x="40" y="176">THE SKILL</text>
          <text x="40" y="188">TAKES → HANDS ON</text>
          <text x="40" y="296">THE OWNER</text>
          <text x="40" y="308">DECIDES</text>
          <text x="40" y="416">LEANS ON</text>
          <text x="40" y="428">OUTSIDE TOOLS</text>
        </g>

        <!-- Stage headers -->
        <g text-anchor="middle">
          <rect x="288" y="40" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="296" y="51" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600">1</text>
          <text x="296" y="76" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="600">Brainstorm</text>
          <text x="296" y="92" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">/planning:brainstorm</text>

          <rect x="576" y="40" width="16" height="16" rx="8" fill="rgba(191,69,32,0.20)"/>
          <text x="584" y="51" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600">2</text>
          <text x="584" y="76" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="600">Make the plan</text>
          <text x="584" y="92" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">/planning:make-plan</text>

          <rect x="864" y="40" width="16" height="16" rx="8" fill="rgba(45,49,66,0.12)"/>
          <text x="872" y="51" fill="#2d3142" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="600">3</text>
          <text x="872" y="76" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="14" font-weight="600">Run the plan</text>
          <text x="872" y="92" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">/planning:exec-plan</text>
        </g>

        <!-- Connectors (before nodes) -->
        <line x1="416" y1="180" x2="464" y2="180" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="704" y1="180" x2="752" y2="180" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M812 136 V120 Q812 112 804 112 H652 Q644 112 644 120 V136" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="688" y="94" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="728" y="103" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">FALSE PREMISE</text>

        <!-- Lane 1: the skill -->
        <g>
          <rect x="176" y="136" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="176" y="136" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="188" y="148" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="206" y="157" fill="rgba(45,49,66,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
          <text x="188" y="180" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Design session</text>
          <text x="188" y="198" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">facts first, then one fork at a time</text>
          <text x="188" y="212" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">design ask → confirmed summary</text>
        </g>
        <g>
          <rect x="464" y="136" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="464" y="136" width="240" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="476" y="148" width="36" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
          <text x="494" y="157" fill="rgba(191,69,32,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
          <text x="476" y="180" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Plan checked against the tree</text>
          <text x="476" y="198" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">tasks joined by After: lines</text>
          <text x="476" y="212" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">summary → reviewed plan</text>
        </g>
        <g>
          <rect x="752" y="136" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="752" y="136" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="764" y="148" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
          <text x="782" y="157" fill="rgba(45,49,66,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">SKILL</text>
          <text x="764" y="180" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Waves of parallel lanes</text>
          <text x="764" y="198" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">whole-tree check, review, regroup</text>
          <text x="764" y="212" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">plan → branch per repo, plan closed</text>
        </g>

        <!-- Lane 2: the owner decides -->
        <g>
          <rect x="176" y="256" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="176" y="256" width="240" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="188" y="268" width="36" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
          <text x="206" y="277" fill="rgba(90,101,128,0.90)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">OWNER</text>
          <text x="188" y="300" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Picks every fork</text>
          <text x="188" y="318" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">confirms the summary</text>
          <text x="188" y="332" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">menu: stop, make-plan, save</text>
        </g>
        <g>
          <rect x="464" y="256" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="464" y="256" width="240" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="476" y="268" width="36" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
          <text x="494" y="277" fill="rgba(90,101,128,0.90)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">OWNER</text>
          <text x="476" y="300" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Answers the forks</text>
          <text x="476" y="318" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">menu: revmux round, plan-review,</text>
          <text x="476" y="332" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">webrev, commit, done</text>
        </g>
        <g>
          <rect x="752" y="256" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="752" y="256" width="240" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="764" y="268" width="36" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
          <text x="782" y="277" fill="rgba(90,101,128,0.90)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">OWNER</text>
          <text x="764" y="300" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">Gives the go</text>
          <text x="764" y="318" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">answers the stop reports</text>
          <text x="764" y="332" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">revdiff, then the pull requests</text>
        </g>

        <!-- Lane 3: outside tools -->
        <g>
          <rect x="176" y="376" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="176" y="376" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="188" y="388" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="204" y="397" fill="rgba(45,49,66,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
          <text x="188" y="420" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">agterm fork page</text>
          <text x="188" y="438" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">pictures from diagram-design</text>
          <text x="188" y="452" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">peer agent via mailbox-chat</text>
        </g>
        <g>
          <rect x="464" y="376" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="464" y="376" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="476" y="388" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="492" y="397" fill="rgba(45,49,66,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
          <text x="476" y="420" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">revmux plan round</text>
          <text x="476" y="438" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">two-model review of the plan</text>
          <text x="476" y="452" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">agterm fork page · webrev</text>
        </g>
        <g>
          <rect x="752" y="376" width="240" height="88" rx="6" fill="#f5f5f5"/>
          <rect x="752" y="376" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
          <rect x="764" y="388" width="32" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="780" y="397" fill="rgba(45,49,66,0.80)" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
          <text x="764" y="420" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">revmux review rounds</text>
          <text x="764" y="438" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">agterm status page · revdiff</text>
          <text x="764" y="452" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">peer agent via mailbox-chat</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="504" x2="992" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="532" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.14em">FLOW</text>
        <line x1="176" y1="529" x2="208" y2="529" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="220" y="532" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">hand-off: the summary, then the plan</text>
        <line x1="520" y1="529" x2="552" y2="529" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="564" y="532" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">the plan goes back for a refresh</text>
      </svg>
    </div>
  </div>
</body>
</html>
